# CI/CD: pruebas en cada push/PR; si pasan en main, Render y Vercel despliegan automáticamente.
name: CI CRM-Agro

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend · pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: secreto-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - name: Pruebas unitarias con cobertura
        run: npm run test:cov
      - name: Base de datos de prueba + datos ficticios
        run: npx prisma db push --skip-generate && npm run db:seed
      - name: Pruebas de integración (API)
        run: npm run test:int

  frontend:
    name: Frontend · pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://crm-agro-api.onrender.com

  desplegar:
    name: Desplegar (sólo main)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Disparar deploy en Render
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "$RENDER_HOOK"
      - name: Vercel
        run: echo "Vercel despliega automáticamente desde la integración con GitHub."
