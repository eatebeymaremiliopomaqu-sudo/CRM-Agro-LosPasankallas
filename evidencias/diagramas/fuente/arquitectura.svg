<rect x="30" y="70" width="220" height="80" rx="10" fill="#F1EEE6" stroke="#9AA59E" stroke-width="1.5"/><text x="140" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A2B">Celular / navegador</text><text x="140" y="112" text-anchor="middle" font-size="12" fill="#1D2420">PWA instalable · sin conexión</text><text x="140" y="129" text-anchor="middle" font-size="12" fill="#1D2420">Propietario · Encargado · Trabajador</text><rect x="30" y="180" width="220" height="70" rx="10" fill="#F1EEE6" stroke="#9AA59E" stroke-width="1.5"/><text x="140" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A2B">WhatsApp</text><text x="140" y="222" text-anchor="middle" font-size="12" fill="#1D2420">Personal de la finca y clientes</text><rect x="30" y="280" width="220" height="70" rx="10" fill="#F1EEE6" stroke="#9AA59E" stroke-width="1.5"/><text x="140" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A2B">Consumidor</text><text x="140" y="322" text-anchor="middle" font-size="12" fill="#1D2420">Escanea el QR del producto</text><rect x="300" y="70" width="230" height="80" rx="10" fill="#E1EEF6" stroke="#1F78B4" stroke-width="1.5"/><text x="415" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A2B">Frontend · Vercel</text><text x="415" y="112" text-anchor="middle" font-size="12" fill="#1D2420">Vue 3 + Vite + Pinia + Router</text><text x="415" y="129" text-anchor="middle" font-size="12" fill="#1D2420">PWA · Leaflet · Chart.js · HTTPS + JWT</text><rect x="300" y="180" width="230" height="70" rx="10" fill="#E1EEF6" stroke="#1F78B4" stroke-width="1.5"/><text x="415" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3A2B">Meta WhatsApp Cloud API</text><text x="415" y="222" text-anchor="middle" font-size="12" fill="#1D2420">Webhook firmado (HMAC)</text><rect x="580" y="60" width="560" height="470" rx="14" fill="#FFFFFF" stroke="#1F3A2B" stroke-width="2"/><text x="860" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1F3A2B">Backend · Render (Node.js + Express)</text><rect x="600" y="100" width="520" height="50" rx="10" fill="#F6E7D4" stroke="#C8823A" stroke-width="1.5"/><text x="860" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">Middleware: Helmet · JWT · RBAC (roles) · requiereModulo() · Zod · auditoría</text><rect x="600" y="165" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="660" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M0 Núcleo</text><text x="660" y="207" text-anchor="middle" font-size="11" fill="#1D2420">finca · usuarios · lotes</text><rect x="730" y="165" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="790" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M1 Campo</text><text x="790" y="207" text-anchor="middle" font-size="11" fill="#1D2420">calendario · carencia</text><rect x="860" y="165" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="920" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M2 Trazabilidad</text><text x="920" y="207" text-anchor="middle" font-size="11" fill="#1D2420">QR · ficha pública</text><rect x="990" y="165" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="1050" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M3 Trabajadores</text><text x="1050" y="207" text-anchor="middle" font-size="11" fill="#1D2420">tareas · jornales</text><rect x="600" y="245" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="660" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M4 Inventarios</text><text x="660" y="287" text-anchor="middle" font-size="11" fill="#1D2420">insumos · productos</text><rect x="730" y="245" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="790" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M5 Ventas</text><text x="790" y="287" text-anchor="middle" font-size="11" fill="#1D2420">pedidos · cobros</text><rect x="860" y="245" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="920" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M6 Vivero</text><text x="920" y="287" text-anchor="middle" font-size="11" fill="#1D2420">plantines</text><rect x="990" y="245" width="120" height="68" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="1050" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">M7 Finanzas</text><text x="1050" y="287" text-anchor="middle" font-size="11" fill="#1D2420">costos · margen</text><rect x="600" y="335" width="250" height="100" rx="10" fill="#FBE4E1" stroke="#C0392B" stroke-width="1.5"/><text x="725" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">Agente IA (transversal)</text><text x="725" y="377" text-anchor="middle" font-size="11" fill="#1D2420">reglas + LLM (Claude/Groq)</text><text x="725" y="394" text-anchor="middle" font-size="11" fill="#1D2420">guardrails: no dosis</text><text x="725" y="411" text-anchor="middle" font-size="11" fill="#1D2420">confirmación SI/NO</text><rect x="870" y="335" width="250" height="100" rx="10" fill="#F6E7D4" stroke="#C8823A" stroke-width="1.5"/><text x="995" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3A2B">Alertas programadas</text><text x="995" y="377" text-anchor="middle" font-size="11" fill="#1D2420">riego · labores · stock mínimo</text><text x="995" y="394" text-anchor="middle" font-size="11" fill="#1D2420">fin de carencia · cobros</text><text x="995" y="411" text-anchor="middle" font-size="11" fill="#1D2420">solo con consentimiento</text><rect x="600" y="450" width="520" height="60