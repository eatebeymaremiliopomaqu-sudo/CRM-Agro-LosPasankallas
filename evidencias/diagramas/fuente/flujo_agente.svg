-width="1.8" marker-end="url(#fr)"/><text x="848" y="164" font-size="12.5" fill="#C0392B">desconocido → mensaje de registro</text><line x1="770" y1="376" x2="840" y2="376" stroke="#C0392B" stroke-width="1.8" marker-end="url(#fr)"/><text x="848" y="380" font-size="12.5" fill="#C0392B">rechazo: "No puedo recomendar dosis…"</text><line x1="770" y1="448" x2="840" y2="448" stroke="#C0392B" stroke-width="1.8" marker-end="url(#fr)"/><text x="848" y="452" font-size="12.5" fill="#C0392B">rechazo: acción no permitida</text><line x1="770" y1="520" x2="840" y2="520" stroke="#C0392B" stroke-width="1.8" marker-end="url(#fr)"/><text x="848" y="524" font-size="12.5" fill="#C0392B">rechazo: "L-05 en carencia hasta…"</text><text x="70" y="592" font-size="12.5" fill="#1F3A2B">NO → cancelado,</text><text x="70" y="608" font-size="12.5" fill="#1F3A2B">no se guarda nada</text><line x1="330" y1="592" x2="200" y2="592" stroke="#9AA59E" stroke-width="1.8" marker-end="url(#f)"/><text x="70" y="304" font-size="12.5" fill="#1F3A2B">Consultas → solo datos</text><text x="70" y="320" font-size="12.5" fill="#1F3A2B">registrados (sin SI/NO)</text><line x1="330" y1="304" x2="236" y2="304" stroke="#9AA59E" stroke-width="1.8" marker-end="url(#f)"/></svg>