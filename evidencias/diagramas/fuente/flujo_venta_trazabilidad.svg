<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="340" viewBox="0 0 1330 340" font-family="Segoe UI, Inter, system-ui, sans-serif">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA59E"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFDF8"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1F3A2B">Flujo de la demo: labor → cosecha → QR → inventario → venta</text>
<rect x="30" y="80" width="195" height="100" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="127.5" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">1 · Labor por WhatsApp</text><text x="127.5" y="122" text-anchor="middle" font-size="11.5" fill="#1D2420">"regué el lote 2 por 2 h"</text><text x="127.5" y="139" text-anchor="middle" font-size="11.5" fill="#1D2420">→ SI → Labor (origen WhatsApp)</text><text x="127" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#C8823A">M1</text><line x1="225" y1="130" x2="243" y2="130" stroke="#9AA59E" stroke-width="1.8" marker-end="url(#f)"/><rect x="245" y="80" width="195" height="100" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="342.5" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">2 · Cosecha</text><text x="342.5" y="122" text-anchor="middle" font-size="11.5" fill="#1D2420">"cosechamos 40 kg de tomate</text><text x="342.5" y="139" text-anchor="middle" font-size="11.5" fill="#1D2420">del lote 2" → valida carencia</text><text x="342" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#C8823A">M1/M2</text><line x1="440" y1="130" x2="458" y2="130" stroke="#9AA59E" stroke-width="1.8" marker-end="url(#f)"/><rect x="460" y="80" width="195" height="100" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="557.5" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">3 · Lote de cosecha + QR</text><text x="557.5" y="122" text-anchor="middle" font-size="11.5" fill="#1D2420">código FLM-2026-0007</text><text x="557.5" y="139" text-anchor="middle" font-size="11.5" fill="#1D2420">token público · eventos</text><text x="557" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#C8823A">M2</text><line x1="655" y1="130" x2="673" y2="130" stroke="#9AA59E" stroke-width="1.8" marker-end="url(#f)"/><rect x="675" y="80" width="195" height="100" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="772.5" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">4 · Inventario</text><text x="772.5" y="122" text-anchor="middle" font-size="11.5" fill="#1D2420">ENTRADA +40 kg</text><text x="772.5" y="139" text-anchor="middle" font-size="11.5" fill="#1D2420">producto "Tomate"</text><text x="772" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#C8823A">M4</text><line x1="870" y1="130" x2="888" y2="130" stroke="#9AA59E" stroke-width="1.8" marker-end="url(#f)"/><rect x="890" y="80" width="195" height="100" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="987.5" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">5 · Venta</text><text x="987.5" y="122" text-anchor="middle" font-size="11.5" fill="#1D2420">detalle con loteCosechaId</text><text x="987.5" y="139" text-anchor="middle" font-size="11.5" fill="#1D2420">SALIDA −25 kg · cobro / saldo</text><text x="987" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#C8823A">M5</text><line x1="1085" y1="130" x2="1103" y2="130" stroke="#9AA59E" stroke-width="1.8" marker-end="url(#f)"/><rect x="1105" y="80" width="195" height="100" rx="10" fill="#E7F2DC" stroke="#3E7B4F" stroke-width="1.5"/><text x="1202.5" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">6 · Ficha pública</text><text x="1202.5" y="122" text-anchor="middle" font-size="11.5" fill="#1D2420">lote → labores → carencia</text><text x="1202.5" y="139" text-anchor="middle" font-size="11.5" fill="#1D2420">→ cosecha → venta (anónima)</text><text x="1202" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#C8823A">M2</text><rect x="245" y="240" width="410" height="70" rx="10" fill="#FBE4E1" stroke="#C0392B" stroke-width="1.5"/><text x="450" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">✋ Bloqueo por carencia (409)</text><text x="450" y="282" text-anchor="middle" font-size="11.5" fill="#1D2420">L-05 con aplicación hace 3 días y 14 d de carencia</text><text x="450" y="299" text-anchor="middle" font-size="11.5" fill="#1D2420">solo el PROPIETARIO puede forzar con justificación</text><line x1="300" y1="182" x2="380" y2="238" stroke="#C0392B" stroke-width="1.8" marker-end="url(#fr)" stroke-dasharray="5 4"/><rect x="690" y="240" width="400" height="70" rx="10" fill="#E1EEF6" stroke="#1F78B4" stroke-width="1.5"/><text x="890" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F3A2B">🔒 Privacidad del QR</text><text x="890" y="282" text-anchor="middle" font-size="11.5" fill="#1D2420">sin nombres, teléfonos, precios ni responsables</text><text x="890" y="299" text-anchor="middle" font-size="11.5" fill="#1D2420">solo tipo de cliente, fecha y cantidad</text><line x1="1167" y1="180" x2="1000" y2="238" stroke="#1F78B4" stroke-width="1.8" marker-end="url(#f)" stroke-dasharray="5 4"/></svg>